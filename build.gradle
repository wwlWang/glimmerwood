plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    clientLaunch {
        runtimeClasspath += sourceSets.main.output
    }
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    devtools {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    clientLaunchImplementation.extendsFrom implementation
    clientLaunchRuntimeOnly.extendsFrom runtimeOnly
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
    devtoolsImplementation.extendsFrom implementation
    devtoolsRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Candidate rendering dependencies stay in the development tools until combined runtime acceptance passes.
dependencies {
    compileOnly files('libs/runtime/gemrender-0.1.17.jar')
    clientLaunchRuntimeOnly files('libs/runtime/gemrender-0.1.17.jar')
    compileOnly fileTree(dir: 'libs/compile', include: '*.jar')
    // Optional: only SpiritGlowIris touches Iris, and it is loaded only when Iris is installed.
    compileOnly 'maven.modrinth:iris:1.8.12+1.21.1-neoforge'
    devtoolsImplementation fileTree(dir: 'libs/runtime', include: '*.jar')
    devtoolsCompileOnly fileTree(dir: 'libs/compile', include: '*.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // Pure node/pose evaluation against the shipped rig; no graphics context or client launch.
    testImplementation files('libs/runtime/gemrender-0.1.17.jar')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel', '**/.cache/**'
}

// Exercise the shipped cave layout under the isolated GameTest namespace without a stale copy.
tasks.named('processGametestResources') {
    from('src/gametest/resources/data/orimod_gametest/structure/platform_room.nbt') {
        into 'data/orimod_p5_worldgen/structure'
    }
    from('src/gametest/resources/data/orimod_gametest/structure/platform_room.nbt') {
        into 'data/orimod_p5/structure'
    }
    from('src/gametest/resources/data/orimod_gametest/structure/platform_room.nbt') {
        into 'data/orimod_p5_i/structure'
    }
    from('src/gametest/resources/data/orimod_gametest/structure/room.nbt') {
        into 'data/orimod_r117/structure'
    }
    from('src/gametest/resources/data/orimod_gametest/structure/room.nbt') {
        into 'data/orimod_cave_rebuild/structure'
    }
    from('src/gametest/resources/data/orimod_gametest/structure/room.nbt') {
        into 'data/orimod_forest_rebuild/structure'
    }
    from('src/gametest/resources/data/orimod_gametest/structure/room.nbt') {
        into 'data/orimod_creek_rebuild/structure'
    }
    from('src/main/resources/data/orimod/structure/ruins/cave_altar.nbt') {
        into 'data/orimod_gametest/structure'
        rename { 'cave.nbt' }
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.devtools
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.clientLaunch

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        orimod_devtools {
            sourceSet sourceSets.devtools
        }
        orimod_gametest {
            sourceSet sourceSets.gametest
        }
    }

    unitTest {
        enable()
        testedMod = mods.orimod
        loadedMods = [mods.orimod]
    }

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        configureEach {
            loadedMods = [mods.orimod]
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            sourceSet = sourceSets.clientLaunch
        }
        devtoolsClient {
            client()
            sourceSet = sourceSets.devtools
            loadedMods = [mods.orimod, mods.orimod_devtools]
            gameDirectory = project.file('run-devtools')
            systemProperty 'orimod.devtools.enabled', 'true'
            systemProperty 'orimod.debugPose', System.getenv('ORIMOD_DEBUG_POSE') ?: 'false'
            jvmArgument '-Xmx4G'
            programArguments.addAll '--width', '1920', '--height', '1080'
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [mods.orimod, mods.orimod_gametest]
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse('orimod_gametest,orimod_r117,orimod_p5,orimod_p5_i,orimod_p5_worldgen,orimod_cave_rebuild,orimod_forest_rebuild,orimod_creek_rebuild,orimod_forest_freeze,orimod_forest_red,orimod_forest_approach,orimod_forest_liquid')
            systemProperty 'orimod.gametest.report', file('build/test-results/gametest.xml').absolutePath
        }
        worldgenAudit {
            server()
            sourceSet = sourceSets.gametest
            loadedMods = [mods.orimod, mods.orimod_gametest]
            gameDirectory = file(providers.gradleProperty('worldgenAuditDir').getOrElse('.external/worldgen-audit'))
            systemProperty 'orimod.worldgen.audit', 'true'
            systemProperty 'orimod.worldgen.audit.mode', providers.gradleProperty('worldgenAuditMode').getOrElse('locate')
            jvmArgument '-Xmx4G'
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// R20: bundled Spirit Glow shader pack (adapted from Mellow by TheCMK, see shaderpacks/spirit-glow/README.md).
var zipSpiritGlow = tasks.register('zipSpiritGlow', Zip) {
    group = 'build'
    description = 'Package shaderpacks/spirit-glow as the shader pack bundled in the mod jar.'
    from('shaderpacks/spirit-glow') {
        include 'shaders/**', 'LICENSE', 'LICENSE-APACHE', 'README.md', 'UPSTREAM.md', 'CHANGES.md'
    }
    archiveFileName = 'spirit_glow.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/shaderpack/orimod_shaderpack')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir('generated/shaderpack')).builtBy(zipSpiritGlow))
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
    dependsOn zipSpiritGlow
    systemProperty 'orimod.spiritGlowZip', zipSpiritGlow.get().archiveFile.get().asFile.absolutePath
    systemProperty 'orimod.spiritGlowSource', file('shaderpacks/spirit-glow').absolutePath
    systemProperty 'orimod.projectDir', projectDir.absolutePath   // FX02: effect sources vs exported definitions
    inputs.dir 'art/source/effects/spirit'
    inputs.dir 'shaderpacks/spirit-glow'
}

tasks.register('verifyPreparedDependencies') {
    group = 'verification'
    description = 'Check the Git LFS dependency artifacts before compiling.'
    def workspace = layout.projectDirectory.asFile
    inputs.file 'dependencies/prepared.json'
    inputs.files fileTree('libs')
    doLast {
        def prepared = new groovy.json.JsonSlurper().parse(new File(workspace, 'dependencies/prepared.json'))
        prepared.artifacts.each { entry ->
            def artifact = new File(workspace, entry.path)
            if (!artifact.isFile()) throw new GradleException("Missing ${entry.path}; install Git LFS and run git lfs pull")
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            if (digest != entry.sha256) throw new GradleException("Dependency checksum mismatch: ${entry.path}; restore with git lfs pull")
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyPreparedDependencies' }
tasks.named('jar') { from 'LICENSE', 'THIRD_PARTY.md' }
// REL01 (R27): byte-identical release jars from the same commit (scripts/build-release.sh checks two builds).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('prepareDevtoolsEnvironment') {
    group = 'development'
    description = 'Verify locked rendering dependencies and initialize a new development shader profile.'
    def workspace = layout.projectDirectory.asFile
    doLast {
        def lock = new groovy.json.JsonSlurper().parse(new File(workspace, 'dependencies/lock.json'))
        (lock.artifacts + lock.sourceBuilds).each { artifact ->
            def jar = new File(workspace, "libs/${artifact.kind ?: 'runtime'}/${artifact.filename}")
            if (!jar.isFile()) throw new GradleException("Missing ${jar.name}; install Git LFS and run git lfs pull")
            def digest = java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes).encodeHex().toString()
            if (digest != artifact.sha512) throw new GradleException("Dependency differs from lock: ${jar.name}")
        }
        def shader = lock.artifacts.find { it.project == 'mellow' }
        def installed = new File(workspace, "run-devtools/shaderpacks/${shader.filename}")
        installed.parentFile.mkdirs()
        if (!installed.exists()) java.nio.file.Files.copy(new File(workspace, "libs/shaders/${shader.filename}").toPath(), installed.toPath())
        def preset = new File("${installed}.txt")
        if (!preset.exists()) java.nio.file.Files.copy(new File(workspace, 'dependencies/shader-settings/mellow.properties').toPath(), preset.toPath())
        def iris = new File(workspace, 'run-devtools/config/iris.properties')
        if (!iris.exists()) {
            iris.parentFile.mkdirs()
            iris.text = "enableShaders=true\nshaderPack=${shader.filename}\n"
        }
    }
}
tasks.named('runDevtoolsClient') { dependsOn 'prepareDevtoolsEnvironment' }

// Disposable GameTest fixtures use distant sites and otherwise accumulate region
// files between runs. Never touch a dev client save or any sibling run directory.
def cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    group = 'verification'
    description = 'Remove only run-gametest/world before rebuilding the temporary test fixtures.'
    delete layout.projectDirectory.dir('run-gametest/world')
    followSymlinks = false
}
tasks.named('runGameTestServer') { dependsOn cleanGameTestWorld }

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
