modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/wwlWang/oriMod/issues"

[[mixins]]
config="orimod.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/wwlWang/oriMod"
authors="wwlwwl"
credits="Character model: Ori Rigged by Random modeler (Seea_Rooster), CC BY 4.0; modified rig, materials and animations remain CC BY 4.0. Spirit Glow shader adapted from Mellow by TheCMK (MIT). See THIRD_PARTY.md. Unofficial fan project, not affiliated with or endorsed by Microsoft, Xbox Game Studios or Moon Studios; Ori belongs to its respective rights holders."
description='''
Unofficial Ori-inspired spirit form, movement abilities, combat and exploration for single-player survival.
Early release; multiplayer and real-GPU coverage are still limited.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gemrender"
type="required"
versionRange="[0.1.17]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="flywheel"
type="required"
versionRange="[1.0.6]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
